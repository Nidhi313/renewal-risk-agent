name: Golden-set evals

# Real LLM calls against the free tier, so this runs only on demand,
# not on every push. Add GROQ_API_KEY / GOOGLE_API_KEY as repo secrets.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Agent + judge provider"
        type: choice
        options: [groq, gemini]
        default: groq

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m src.eval.run_evals
        env:
          MODEL_PROVIDER: ${{ inputs.provider }}
          FALLBACK_PROVIDER: ""
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
