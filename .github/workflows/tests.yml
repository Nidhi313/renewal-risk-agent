name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest tests -v
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t renewal-risk-agent .
      - name: Container boots and answers health checks
        run: |
          docker run -d --name app -p 8080:8080 renewal-risk-agent
          for i in $(seq 1 30); do curl -fsS localhost:8080/health/ && exit 0; sleep 1; done
          docker logs app; exit 1
