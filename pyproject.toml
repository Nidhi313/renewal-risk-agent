[project]
name = "renewal-risk-agent"
version = "0.1.0"
description = "Renewal-risk agent with a judge integrity toolkit for validating LLM-as-judge reliability."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:langgraph.*", "ignore:create_react_agent has been moved"]
